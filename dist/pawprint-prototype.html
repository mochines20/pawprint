<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pawprint Mobile Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized app (map-first, bottom sheet, thumb-zone nav) centred on desktop, filling the screen on phones. Brand tokens from the Pawprint system. */
:root{--bg:#E9E6DF;--paper:#FAF8F4;--ink:#151515;--card:#fff;--stone:#8C8A84;--line:#E4E1DA;--amber:#FFB400;--amber-d:#E09A00;--red:#D9402B;--cream:#FFF6DD;--tile1:#FFE9B8;--tile2:#E8E4F4;
--edge:#151515;--shadow:#151515;--on-amber:#151515;--chipc:#EEEBE3;--m-land:#EDEAE3;--m-park:#DCE8CE;--m-water:#CFE3EE;--m-road:#fff;--m-line:#DAD6CC;--m-text:#6F8FA3;--dim:rgba(21,21,21,.14);--zoneop:.22;
--f:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0C;--paper:#18181A;--ink:#FAF8F4;--card:#242427;--stone:#A9A7A0;--line:#3A3A3E;--cream:#3A3321;--tile1:#4A3E22;--tile2:#34304A;--edge:#F2EFE8;--shadow:#000;--chipc:#34343A;--m-land:#2A2A2D;--m-park:#2F3A2B;--m-water:#25363F;--m-road:#3C3C41;--m-line:#34343A;--m-text:#7FA1B5;--dim:rgba(0,0,0,.35);--zoneop:.28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0C;--paper:#18181A;--ink:#FAF8F4;--card:#242427;--stone:#A9A7A0;--line:#3A3A3E;--cream:#3A3321;--tile1:#4A3E22;--tile2:#34304A;--edge:#F2EFE8;--shadow:#000;--chipc:#34343A;--m-land:#2A2A2D;--m-park:#2F3A2B;--m-water:#25363F;--m-road:#3C3C41;--m-line:#34343A;--m-text:#7FA1B5;--dim:rgba(0,0,0,.35);--zoneop:.28;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.stage{height:100%;display:grid;place-items:center}
.app{position:relative;width:min(100%,400px);height:min(100%,860px);background:var(--paper);border:2.5px solid var(--edge);border-radius:34px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden;isolation:isolate}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 96px}
/* shared pieces */
.card{background:var(--card);border:2px solid var(--edge);border-radius:18px;box-shadow:3px 3px 0 var(--shadow)}
.dark{background:#151515;color:#fff;border-color:#151515;box-shadow:3px 3px 0 var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;border:1.5px solid var(--edge);background:var(--card);white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper)}.chip.cream{background:var(--cream)}.chip.amb{background:var(--amber);color:var(--on-amber)}
.rar{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1.5px solid var(--edge);background:var(--chipc);color:var(--ink)}.rar.u{background:#D9F0DC;color:#151515}.rar.r{background:var(--amber);color:#151515}
.av{display:grid;place-items:center;overflow:hidden;flex:none;border:2px solid var(--edge);border-radius:14px;background:var(--tile1)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;align-items:center;gap:10px}
.small{font-size:12px;color:var(--stone);font-weight:500}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;border:2px solid var(--edge);border-radius:16px;background:var(--amber);color:var(--on-amber);font-weight:700;font-size:17px;box-shadow:3px 3px 0 var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink)}.btn.red{background:var(--red);color:#fff}.btn.sm{min-height:46px;font-size:15px}
.btn.rline{background:var(--card);color:var(--red);border-color:var(--red);box-shadow:3px 3px 0 var(--red)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .7s cubic-bezier(.3,.8,.3,1)}
.ib{width:38px;height:38px;border:2px solid var(--edge);border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:2px 2px 0 var(--shadow);flex:none}
.ib svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px) 14px 8px;gap:8px;min-height:56px}
.topbar h1{font-size:17px;font-weight:600}
.sw{width:46px;height:28px;border-radius:99px;border:2px solid var(--edge);background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--edge);transition:transform .2s}
.sw[aria-checked=true]{background:var(--amber)}.sw[aria-checked=true]::after{transform:translateX(18px)}
/* nav */
.nav{position:absolute;left:12px;right:12px;bottom:12px;height:66px;background:#151515;border-radius:24px;display:flex;align-items:center;justify-content:space-around;color:#bdbab2;z-index:30;box-shadow:0 0 0 2px var(--edge)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;height:56px;justify-content:center;font-size:10.5px;font-weight:600;color:#bdbab2}
.nav button.on{color:var(--amber)}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .fab{width:58px;height:58px;border-radius:50%;background:var(--amber);color:#151515;margin-top:-34px;border:3.5px solid var(--paper);box-shadow:0 0 0 2px var(--edge);transition:transform .12s}
.nav .fab:active{transform:scale(.93)}
.nav .fab svg{width:26px;height:26px;stroke-width:2.3}
/* home map */
.map{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--m-land)}
.m-land{fill:var(--m-land)}.m-park{fill:var(--m-park)}.m-water{fill:var(--m-water)}.m-road{stroke:var(--m-road)}.m-line{stroke:var(--m-line)}.m-text{fill:var(--m-text)}
.pin{cursor:pointer}.pin .halo{fill:var(--amber);opacity:0;transition:opacity .2s}.pin.sel .halo{opacity:.35}
.pin .body{transition:transform .25s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}.pin.sel .body{transform:scale(1.22)}
.pin:focus-visible{outline:none}.pin:focus-visible .zone{stroke-width:4}
@keyframes pop{0%{transform:scale(0) translateY(-30px);opacity:0}60%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.pin.new .body{animation:pop .6s cubic-bezier(.3,1.2,.4,1)}
.floatbar{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.floatbar>*{pointer-events:auto}
.glass{background:var(--card);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--shadow)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border:2.5px solid var(--edge);border-bottom:0;border-radius:28px 28px 0 0;z-index:20;display:flex;flex-direction:column;will-change:transform;transition:transform .35s cubic-bezier(.25,.9,.3,1)}
.sheet.drag{transition:none}
.sheet .grab{padding:10px 0 8px;touch-action:none;cursor:grab;flex:none}.sheet .grab i{display:block;width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet .sbody{padding:2px 14px 96px;overflow:hidden;flex:1}.sheet.full .sbody{overflow-y:auto}
.hint{position:absolute;left:12px;z-index:6;transition:bottom .35s}
/* camera */
.cam{background:#000;color:#fff;z-index:40}
.cam .scene{position:absolute;inset:0;width:100%;height:100%}
.cam .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,21,21,.55),transparent 22%,transparent 55%,rgba(21,21,21,.85))}
.cam .bk{position:absolute;width:38px;height:38px;border:4px solid var(--amber);transition:transform .3s}
.cam.lock .bk{animation:lockin .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes lockin{from{transform:scale(1.25)}}
.shutter{width:88px;height:88px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center}.shutter i{display:block;width:66px;height:66px;border-radius:50%;background:var(--amber);border:3px solid #151515;transition:transform .1s}.shutter:active i{transform:scale(.88)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:fl .45s ease}
@keyframes fl{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
.camphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* reward */
.confetti i{position:absolute;border-radius:50%;animation:fall 1.8s ease-out both}
@keyframes fall{from{transform:translateY(-40px) scale(0);opacity:0}30%{opacity:1;transform:scale(1)}to{transform:translateY(16px)}}
.rise{animation:rise .5s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);background:#151515;color:#fff;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:90;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;border:2px solid var(--edge)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.entry{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.entry .nm{font-weight:600;font-size:14.5px;line-height:1.15}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gc{padding:8px;text-align:left;display:block;width:100%}.gc .av{width:100%;aspect-ratio:1;border-radius:16px}
.need{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;border:1.5px solid var(--edge);background:var(--card)}
.need[aria-pressed=true]{background:var(--red);color:#fff;box-shadow:2px 2px 0 var(--shadow)}
textarea{width:100%;font:inherit;font-size:14px;border:2px solid var(--edge);border-radius:14px;padding:10px 12px;background:var(--card);color:var(--ink);resize:none;height:62px}
.seg{display:flex;gap:6px}
.tab-title{font-size:26px;font-weight:700;line-height:1.1}
.cat{display:inline-block;line-height:0;position:relative;z-index:0}
.themebtn{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:200;display:none}
@media (min-width:700px){.themebtn{display:grid}}
@media (max-height:640px){.app{border-radius:24px}.nav{height:60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="stage"><div class="app" id="app"></div></div>
<button class="ib themebtn" id="themebtn" aria-label="Toggle dark mode"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>

<script>/*!

 *  - hops while the page scrolls (and travels along the bottom of the screen)
 *  - when you stop: sits, then grooms, looks around, stretches, and finally sleeps
 *  - wakes up (with a little "!") when you scroll, tap, or press a key
 * No dependencies. ~10 KB. Respects prefers-reduced-motion.
 *
 * Usage:   <script src="pawprint-cat.js"><\/script>
 *          <script>PawprintCat.init()<\/script>

          '<ellipse class="pp-pupil" cx="-10" cy="1" rx="5.4" ry="9.5"/><ellipse class="pp-pupil" cx="18" cy="1" rx="5.4" ry="9.5"/>' +

    return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')"><g class="pp-headanim ' + (cls || '') + '">' +

      '<path class="pp-amber pp-charm" d="M3 55C-4 47 -6 42 -6 39A9 9 0 1 1 12 39C12 42 10 47 3 55Z"/><circle class="pp-pupil" cx="3" cy="39" r="3"/>' +
      '<path class="pp-ink" d="' + HEAD_PATH + '"/>' +
      '<path class="pp-hi" d="M-24 -21Q-8 -29 10 -27"/>' +
      '<g class="pp-stripe" clip-path="url(#pp-c-head)"><path d="M-8 -34V-20M0 -35V-17M8 -34V-20M-37 4L-24 6M-36 13L-24 11M37 4L24 6M36 13L24 11"/></g>' +

      '<path class="pp-stone" d="M25 9Q31 6.5 36 9.5Q34.5 16 30.5 18Q26 15 25 9Z"/>' +
      '<path class="pp-line-stone" d="M30.5 18V22M23 24Q27 29 30.5 22.5Q34 29 38 24"/>' +

  }

  var SIT_BODY =
    '<path class="pp-ink pp-breathe" d="' + BODY_SIT + '"/>' +
    '<path class="pp-hi" d="M58 122Q72 106 98 104"/>' +
    '<g class="pp-stripe" clip-path="url(#pp-c-sit)"><path d="M44 126l24 6M48 142l22 4M60 112l22 14M80 104l20 14"/></g><g class="pp-patch" clip-path="url(#pp-c-sit)"><path class="pp-orange" d="M30 90H92Q84 130 60 150Q40 160 30 150Z"/><path class="pp-black" d="M112 152Q132 140 150 152V192H112Z"/></g>' +

        '<path class="pp-ink" d="M60 116C52 126 44 136 38 148C34 156 44 160 50 154C58 146 70 134 78 124Z"/>' +
        '<path class="pp-ink" d="' + BODY_JUMP + '"/>' +
        '<path class="pp-hi" d="M58 96Q84 86 114 92"/>' +
        '<g class="pp-stripe" clip-path="url(#pp-c-jump)"><path d="M56 100l8 28M72 94l8 36M88 90l8 40M104 92l6 38"/></g><g class="pp-patch" clip-path="url(#pp-c-jump)"><path class="pp-orange" d="M44 84Q70 76 96 92Q92 132 56 134Z"/><path class="pp-black" d="M114 76Q142 86 156 100L146 132L120 126Z"/></g>' +
        '<path class="pp-ink" d="M130 106C146 110 160 117 172 124C181 129 178 140 168 139C156 137 142 129 128 123Z"/>' +
        '<path class="pp-ink" d="M124 116C138 124 150 134 158 144C163 151 156 158 149 153C140 147 130 138 120 128Z"/>' +
        head(150, 74, 1.06, 'open') +
      '</g>',
    groom:
      '<g class="pp-pose pp-groom">' + SIT_TAIL + SIT_BODY +
        '<ellipse class="pp-ink" cx="138" cy="183" rx="13" ry="6.5"/>' +
        head(117, 96, 1.2, 'closed', 'pp-groom-head') +

      '</g>',
    stretch:
      '<g class="pp-pose pp-stretch">' +
        '<path class="pp-stroke-ink pp-tail-jump" d="M44 112C24 94 28 66 48 54"/>' +
        '<path class="pp-ink" d="M46 118C42 142 48 164 50 178C50 184 72 184 72 178C70 162 70 140 76 122Z"/>' +
        '<path class="pp-ink" d="M62 124C60 146 66 164 70 178C71 184 92 184 90 177C86 160 84 142 88 126Z"/>' +

  return '<div class="screen cam" id="cam"><svg class="scene" viewBox="0 0 332 392" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C3F6B"/><stop offset=".6" stop-color="#E7A66A"/><stop offset="1" stop-color="#F3CE9A"/></linearGradient></defs><rect width="332" height="392" fill="url(#dusk)"/><g fill="#2A2C4C" opacity=".85"><rect x="0" y="160" width="70" height="170"/><rect x="78" y="120" width="56" height="210"/><rect x="200" y="140" width="64" height="190"/><rect x="270" y="176" width="62" height="154"/></g><g fill="#FFD66B" opacity=".9"><rect x="14" y="182" width="9" height="9"/><rect x="38" y="182" width="9" height="9"/><rect x="14" y="214" width="9" height="9"/><rect x="92" y="146" width="9" height="9"/><rect x="112" y="178" width="9" height="9"/><rect x="214" y="170" width="9" height="9"/><rect x="238" y="204" width="9" height="9"/><rect x="286" y="206" width="9" height="9"/></g><rect y="320" width="332" height="72" fill="#7A6A5A"/><rect y="320" width="332" height="8" fill="#9A8A78"/><path d="M0 352H332" stroke="#C9BBA6" stroke-width="3" stroke-dasharray="14 12"/></svg>'+
  (cam.photo?'<img class="camphoto" alt="Your photo" src="'+cam.photo+'">':'<div id="camcat" style="position:absolute;left:50%;bottom:23%;transform:translateX(-50%)">'+cat(v,'230px')+'</div>')+
  '<div class="shade"></div><div class="flash" id="flash"></div>'+
  '<i class="bk" style="left:44px;top:34%;border-right:0;border-bottom:0;border-radius:12px 0 0 0"></i><i class="bk" style="right:44px;top:34%;border-left:0;border-bottom:0;border-radius:0 12px 0 0"></i><i class="bk" style="left:44px;bottom:29%;border-right:0;border-top:0;border-radius:0 0 0 12px"></i><i class="bk" style="right:44px;bottom:29%;border-left:0;border-top:0;border-radius:0 0 12px 0"></i>'+
  '<div class="row" style="position:absolute;left:14px;right:14px;top:14px;justify-content:space-between"><button class="ib" data-closecam aria-label="Close camera">'+IC.x+'</button><span class="chip" style="background:#151515;color:#fff;border-color:#fff"><i style="width:8px;height:8px;border-radius:50%;background:#FF5A4A;display:inline-block"></i>Camera only</span><button class="ib" data-noflash aria-label="Flash off" style="opacity:.85">'+IC.bolt+'</button></div>'+
  (cam.tip?'<div class="row" style="position:absolute;left:14px;right:14px;top:66px;background:var(--cream);color:#151515;border:2px solid #151515;border-radius:14px;padding:8px 10px;font-size:12px;font-weight:600"><span style="flex:1">Keep your distance · No flash · Don\'t chase</span><button data-tip class="ib" style="width:24px;height:24px;border-radius:8px;box-shadow:none;background:#fff" aria-label="Dismiss tip"><svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:#151515"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>':'')+
  '<span class="chip amb" id="detect" style="position:absolute;left:50%;top:30%;transform:translateX(-50%);opacity:0;transition:opacity .3s;box-shadow:2px 2px 0 #151515;color:#151515;border-color:#151515"></span>'+
  '<div class="row" style="position:absolute;left:0;right:0;bottom:56px;justify-content:space-around;padding:0 24px"><label class="ib" style="width:52px;height:52px;border-radius:16px;cursor:pointer" title="Use my own photo" aria-label="Use my own photo"><input type="file" id="file" accept="image/*" capture="environment" hidden>'+IC.img.replace('currentColor','#151515')+'</label><button class="shutter" data-shutter aria-label="Take photo"><i></i></button><button class="ib" style="width:52px;height:52px;border-radius:50%" data-flip aria-label="Flip camera">'+IC.flip+'</button></div>'+
  '<div class="row" style="position:absolute;left:0;right:0;bottom:22px;justify-content:center;gap:6px;font-size:11px;font-weight:500;color:#fff">'+IC.lock+' Pin stays approximate · delayed 5 min</div></div>';
}
var R=null;
function rewardScreen(){
  var v=R.v,c=COAT[v],isNew=R.isNew;
  var dots=[[30,70,10,'#FFB400'],[310,100,8,'#D9402B'],[60,200,7,'currentColor'],[300,250,12,'#FFB400'],[24,330,9,'#FFB400'],[318,370,7,'currentColor'],[150,44,7,'#D9402B'],[250,52,9,'#FFB400']].map(function(d,i){return '<i style="position:absolute;left:'+d[0]+'px;top:'+d[1]+'px;width:'+d[2]+'px;height:'+d[2]+'px;background:'+d[3]+';animation-delay:'+(i*80)+'ms"></i>'}).join('');
  var a=R.photo?{v:v,photo:R.photo}:{v:v};
  return '<div class="screen" style="background:var(--paper);z-index:45"><div class="confetti" style="position:absolute;inset:0;pointer-events:none;color:var(--ink)">'+dots+'</div>'+
  '<div class="scroll" style="padding-top:44px;padding-bottom:150px"><div style="text-align:center" class="rise"><span class="chip amb" style="font-size:12px;box-shadow:2px 2px 0 var(--shadow)">'+(isNew?'New coat discovered':'Seen again')+'</span></div>'+
  '<div style="display:flex;justify-content:center;margin-top:16px" class="rise"><div style="box-shadow:6px 6px 0 var(--shadow);border-radius:44px">'+av(a,180,44)+'</div></div>'+
  '<div style="text-align:center;margin-top:18px" class="rise"><div style="font-size:30px;font-weight:700;line-height:1.1">'+c.name+' spotted!</div><div class="row" style="justify-content:center;gap:8px;margin-top:8px"><span class="rar '+c.rc+'">'+c.rar+'</span><span class="small">Today · Alabang area</span></div></div>'+
  '<div class="card rise" style="margin-top:18px;padding:12px 14px"><div class="row" style="justify-content:space-between"><b style="font-size:15px">+'+R.xp+' XP</b><span class="small">Alley Scout → Night Watcher</span></div><div class="bar" style="margin-top:8px"><i id="rxp" style="width:'+Math.round((S.xp-R.xp)/S.xpMax*100)+'%"></i></div><div class="small" style="margin-top:6px">'+(S.xpMax-S.xp)+' XP to the next medal</div></div>'+
  '<div class="row rise" style="margin-top:12px;gap:10px;align-items:stretch"><div class="card dark" style="flex:1;padding:10px 12px;display:flex;align-items:center;gap:8px"><div style="width:46px;height:46px;display:grid;place-items:center;flex:none">'+cat('orange','46px')+'</div><div><div style="font-size:10.5px;color:#bdbab2">Streak</div><div style="font-size:20px;font-weight:700;line-height:1;color:var(--amber)">'+(R.streakUp?(S.streak-1)+' → '+S.streak:S.streak+' kept')+'</div></div></div><div class="card" style="flex:1;padding:10px 12px;display:flex;flex-direction:column;justify-content:center"><div class="small">Coat collection</div><div style="font-size:20px;font-weight:700;line-height:1.1">'+S.coats+' / 24</div></div></div></div>'+
  '<div style="position:absolute;left:14px;right:14px;bottom:18px"><button class="btn" data-add>Add to my Cat Journal</button><div class="row" style="justify-content:space-between;margin-top:12px;padding:0 4px"><span style="font-size:13px;font-weight:600">Show as approximate pin (24h)</span><button class="sw" role="switch" aria-checked="'+(R.pin)+'" data-rpin aria-label="Show as approximate pin"></button></div></div></div>';
}
var CF={need:'Water',note:''};
function careFlowScreen(){
  var needs=['Water','Food','Injured','Kittens alone','Stuck / unsafe','Other'];
  return '<div class="screen" style="background:var(--paper);z-index:46"><div class="topbar"><button class="ib" data-closeflow aria-label="Back">'+IC.back+'</button><h1>Raise a Care Flag</h1><span style="width:38px"></span></div><div class="scroll" style="padding-bottom:130px"><div class="eyebrow">What does the cat need?</div><div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px">'+needs.map(function(n){return '<button class="need" data-need="'+n+'" aria-pressed="'+(CF.need===n)+'">'+(CF.need===n?IC.check+' ':'')+n+'</button>'}).join('')+'</div>'+
  '<div class="eyebrow" style="margin-top:16px">Photo</div><div class="row" style="gap:10px;margin-top:8px"><span class="av" style="width:64px;height:64px;border-radius:18px">'+cat('orange','64px',true)+'</span><span style="width:64px;height:64px;border:2px dashed var(--stone);border-radius:18px;display:grid;place-items:center;font-size:26px;color:var(--stone)">+</span><div class="small" style="flex:1">Camera only. Faces and plates are blurred automatically.</div></div>'+
  '<div class="eyebrow" style="margin-top:16px">Note (optional)</div><textarea id="cfnote" style="margin-top:8px" placeholder="Near the corner store, looks thirsty…">'+CF.note+'</textarea>'+
  '<div class="card" style="margin-top:14px;height:140px;position:relative;overflow:hidden"><svg viewBox="0 0 300 140" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="position:absolute;inset:0"><rect class="m-land" width="300" height="140"/><rect class="m-park" x="14" y="14" width="70" height="46" rx="16"/><g class="m-road" fill="none" stroke-linecap="round"><path d="M-10 90L320 70" stroke-width="12"/><path d="M110 -10L150 160" stroke-width="10"/><path d="M-10 40L320 120" stroke-width="7"/></g><circle cx="150" cy="78" r="44" fill="#D9402B" fill-opacity=".16" stroke="#D9402B" stroke-width="2" stroke-dasharray="4 4"/>'+pinSvg(150,92,'#D9402B',1.1)+'</svg><span class="chip cream" style="position:absolute;left:10px;bottom:10px">Approximate area · not exact</span></div>'+
  '<div class="small" style="margin-top:10px;display:flex;gap:6px;align-items:flex-start">'+IC.lock+'<span>Shared only with nearby volunteers and trusted rescue partners.</span></div></div>'+
  '<div style="position:absolute;left:14px;right:14px;bottom:16px"><button class="btn red" data-sendflag>'+IC.flag+' Send Care Flag</button><div class="small" style="text-align:center;margin-top:8px">Not an emergency service. For urgent injuries, contact a local vet.</div></div></div>';
}
/* ------------------------------------------------ render */
var overlay='';
function render(){
  var body={home:homeScreen,book:journalScreen,care:careScreen,user:profileScreen}[S.tab]();
  app.innerHTML=body+overlay+'<div class="toast" id="toast" role="status"></div>';
  hydrate(app);
  if(S.tab==='home')placeSheet(false);
}
function placeSheet(anim){
  var sh=$('#sheet');if(!sh)return;
  var H=app.clientHeight,full=Math.min(H-124,SNAPS.full+80);
  sh.style.height=full+'px';
  var snap=S.sel?'mid':S.snap;var vis=snap==='full'?full:Math.min(SNAPS[snap],full);
  sh.classList.toggle('full',snap==='full');
  if(!anim)sh.classList.add('drag');
  sh.style.transform='translateY('+(full-vis)+'px)';
  var h=$('#hint');if(h){h.style.bottom=(vis+12)+'px';h.style.opacity=snap==='full'?0:1}
  if(!anim){void sh.offsetWidth;sh.classList.remove('drag')}
}
/* drag */
function bindDrag(){
  var grab=$('#grab'),sh=$('#sheet');if(!grab)return;
  var sy,start,full,pid=null,last=0,lt=0,vel=0;
  grab.addEventListener('pointerdown',function(e){pid=e.pointerId;grab.setPointerCapture(pid);sy=e.clientY;full=sh.offsetHeight;var m=/translateY\(([-\d.]+)px\)/.exec(sh.style.transform);start=m?+m[1]:0;sh.classList.add('drag');last=e.clientY;lt=e.timeStamp;vel=0});
  grab.addEventListener('pointermove',function(e){if(pid!==e.pointerId)return;var dt=e.timeStamp-lt;if(dt>0)vel=(e.clientY-last)/dt;last=e.clientY;lt=e.timeStamp;var y=Math.max(0,Math.min(full-120,start+(e.clientY-sy)));sh.style.transform='translateY('+y+'px)';var h=$('#hint');if(h){h.style.bottom=(full-y+12)+'px';h.style.opacity=(full-y)>full-30?0:1}});
  function end(e){if(pid!==e.pointerId)return;pid=null;sh.classList.remove('drag');var m=/translateY\(([-\d.]+)px\)/.exec(sh.style.transform);var y=m?+m[1]:0;var vis=full-y;
    var pts=[['peek',Math.min(SNAPS.peek,full)],['mid',SNAPS.mid],['full',full]];
    var target=vel<-.5?pts.filter(function(p){return p[1]>vis+20})[0]||pts[2]:vel>.5?pts.slice().reverse().filter(function(p){return p[1]<vis-20})[0]||pts[0]:pts.slice().sort(function(a,b){return Math.abs(a[1]-vis)-Math.abs(b[1]-vis)})[0];
    S.snap=target[0];if(S.sel&&S.snap==='peek')S.snap='mid';placeSheet(true)}
  grab.addEventListener('pointerup',end);grab.addEventListener('pointercancel',end);
  grab.addEventListener('keydown',function(e){if(e.key==='ArrowUp'||e.key==='ArrowDown'){var o=['peek','mid','full'],i=o.indexOf(S.snap);S.snap=o[Math.max(0,Math.min(2,i+(e.key==='ArrowUp'?1:-1)))];placeSheet(true);e.preventDefault()}})
}
/* actions */
function go(t){
  if(t==='spot'){openCam();return}
  S.tab=t;S.sel=null;overlay='';render();bindDrag()
}
function openCam(){cam.busy=false;cam.photo=null;var undiscovered=['calico','orange','black'].filter(function(v){return !S.cats.some(function(c){return c.mine&&c.v===v})});S.camV=undiscovered.length?undiscovered[0]:['orange','calico','black'][S.nid%3];overlay=camScreen();render();hydrate(app)}
function shoot(){
  if(cam.busy)return;cam.busy=true;buzz(15);
  var f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  var cm=$('#cam');cm.classList.add('lock');
  var v=S.camV,conf=90+Math.floor(Math.random()*9);
  setTimeout(function(){var d=$('#detect');if(!d)return;d.innerHTML=IC.check+' Cat detected · '+COAT[v].name+' · '+conf+'%';d.style.opacity=1;buzz([10,40,10])},550);
  setTimeout(function(){
    var isNew=!S.cats.some(function(c){return c.mine&&c.v===v});
    var xp=isNew?40:10;S.xp=Math.min(S.xpMax,S.xp+xp);var streakUp=!S.done;if(streakUp){S.streak++;S.done=true}
    if(isNew)S.coats++;
    R={v:v,isNew:isNew,xp:xp,streakUp:streakUp,photo:cam.photo,pin:true};
    overlay=rewardScreen();render();
    var b=$('#rxp');if(b){var w=Math.round(S.xp/S.xpMax*100);setTimeout(function(){b.style.width=w+'%'},350)}
  },1500);
}
function addCat(){
  var v=R.v,spot=SPOTS[S.nid%SPOTS.length];
  var ex=S.cats.filter(function(c){return c.mine&&c.v===v})[0];
  var id=S.nid++;
  if(ex){ex.seen++;ex.when='Today · Alabang';if(R.photo)ex.photo=R.photo;id=ex.id}
  else S.cats.push({id:id,v:v,when:'Today · Alabang',x:spot[0],y:spot[1],mine:true,seen:1,exp:'24h 00m',ago:'just now',photo:R.photo,fresh:true,hidden:!R.pin});
  if(!R.pin){var c=S.cats.filter(function(c){return c.id===id})[0];c.hidden=true}
  S.cats=S.cats.filter(function(c){return !c.hidden||c.mine});
  overlay='';S.tab='home';S.sel=null;S.snap='peek';render();bindDrag();
  toast(ex?'Sighting added to your journal':'Added to your Cat Journal');buzz(12);
  setTimeout(function(){S.cats.forEach(function(c){c.fresh=false})},800);
}
/* events */
app.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-pin],label');if(!t)return;
  var d=t.dataset;
  if(d.go){go(d.go);return}
  if(d.pin!==undefined){var id=+d.pin;
    if(S.tab!=='home'&&d.jump!==undefined){S.tab='home'}
    S.sel=id;S.snap='mid';render();bindDrag();return}
  if(d.close!==undefined){S.sel=null;S.snap='peek';render();bindDrag();return}
  if(d.saw){var c=S.cats.filter(function(c){return c.id===+d.saw})[0];if(!c.sawit){c.sawit=true;S.xp=Math.min(S.xpMax,S.xp+5);toast('+5 XP · thanks for confirming');buzz(10)}render();bindDrag();return}
  if(d.locate!==undefined){toast('Centred on your approximate area');return}
  if(d.careflag!==undefined){CF={need:'Water',note:''};overlay=careFlowScreen();render();hydrate(app);return}
  if(d.closeflow!==undefined){overlay='';render();bindDrag();return}
  if(d.need){CF.need=d.need;var n=$('#cfnote');CF.note=n?n.value:'';overlay=careFlowScreen();render();hydrate(app);return}
  if(d.sendflag!==undefined){var n2=$('#cfnote');S.myflags.unshift({id:S.nid++,need:CF.need,where:'Alabang · your area',v:'orange',note:(n2&&n2.value.trim())||('Needs: '+CF.need.toLowerCase()),mine:true});overlay='';S.tab='care';render();toast('Care Flag sent to 3 nearby volunteers');buzz(20);return}
  if(d.help){var f=S.flags.filter(function(f){return f.id===+d.help})[0];f.help=!f.help;render();toast(f.help?'Volunteers notified you\'re on your way':'Cancelled');return}
  if(d.closecam!==undefined){overlay='';render();bindDrag();return}
  if(d.noflash!==undefined){toast('No flash keeps cats calm');return}
  if(d.flip!==undefined){toast('Back camera only in this demo');return}
  if(d.tip!==undefined){cam.tip=false;var cm=$('#cam');overlay=camScreen();var keepBusy=cam.busy;render();hydrate(app);return}
  if(d.shutter!==undefined){shoot();return}
  if(d.add!==undefined){addCat();return}
  if(d.rpin!==undefined){R.pin=!R.pin;t.setAttribute('aria-checked',R.pin);return}
  if(d.vis!==undefined){var o=['Everyone','Friends','Only me'];S.vis=o[(o.indexOf(S.vis)+1)%3];render();return}
  if(d.approx!==undefined){toast('Exact locations are never shown');return}
  if(d.del!==undefined){$('#delrow').innerHTML='<div class="card" style="padding:12px"><div style="font-size:14px;font-weight:600">Delete all your pawprints and account data?</div><div class="small" style="margin:4px 0 10px">Photos and sightings are removed permanently. This demo does not store anything.</div><div class="row"><button class="btn sm ghost" data-delno style="flex:1">Keep my data</button><button class="btn sm red" data-delyes style="flex:1">Delete</button></div></div>';return}
  if(d.delno!==undefined){render();return}
  if(d.delyes!==undefined){render();toast('Demo only: nothing was deleted');return}
  if(d.reset!==undefined){location.reload();return}
});
app.addEventListener('change',function(e){
  if(e.target.id==='file'){var f=e.target.files&&e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){cam.photo=rd.result;cam.busy=false;overlay=camScreen();render();hydrate(app);toast('Photo loaded. Tap the shutter.')};rd.readAsDataURL(f)}
});
app.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.pin')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
/* tap map blank closes detail */
app.addEventListener('click',function(e){if(S.tab==='home'&&S.sel&&e.target.closest('.map')&&!e.target.closest('.pin')){S.sel=null;S.snap='peek';render();bindDrag()}});
window.addEventListener('resize',function(){placeSheet(false)});
/* theme button (desktop) */
var tb=$('#themebtn');tb.addEventListener('click',function(){var r=document.documentElement;var dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',dark?'light':'dark')});
render();bindDrag();
})();
</script>

</body>
</html>
